version: '3.9'

services:
  client:
    container_name: library-client
    build: ./client
    ports:
      - 5173:5173
    environment:
      - VITE_API_URL=http://library-server:8080/api
  server:
    container_name: library-server
    build: ./server
    environment:
      - DATABASE_URL=jdbc:postgresql://database:5432/postgres
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
    ports:
      - 8080:8080
    depends_on:
      - database
  database:
    container_name: library-database
    image: postgres:15
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: {}